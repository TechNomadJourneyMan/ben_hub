<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BEN Интенсив — Найди, где ты теряешь деньги</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=DM+Sans:ital,wght@0,400;0,500;0,600;1,400&family=Archivo:wght@500;700;900&family=Inter:wght@400;500;600;700&family=Fraunces:ital,wght@0,500;0,700;1,500&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

/* ── DARK (default) ── */
:root, [data-theme="dark"] {
  --bg:        #0F1428;
  --bg2:       #161B3D;
  --bg-card:   #1A2049;
  --indigo:    #6366F1;
  --indigo-bg: #1E2558;
  --orange:    #F05A28;
  --orange-h:  #DB4D1F;
  --green:     #10B981;
  --red:       #EF4444;
  --text:      #F0F2FF;
  --text-2:    #C8CCE5;
  --dim:       #9498BD;
  --muted:     #5A6088;
  --border:    rgba(255,255,255,0.09);
  --border-2:  rgba(255,255,255,0.04);
  --shadow:    0 8px 32px rgba(0,0,0,0.4);
  --hero-grad-a: #1A2049;
  --hero-grad-b: #0F1428;
}

/* ── LIGHT ── */
[data-theme="light"] {
  --bg:        #F5F7FB;
  --bg2:       #FFFFFF;
  --bg-card:   #FFFFFF;
  --indigo:    #4347C4;
  --indigo-bg: #EEF0FB;
  --orange:    #F05A28;
  --orange-h:  #DB4D1F;
  --green:     #10B981;
  --red:       #DC2626;
  --text:      #0F172A;
  --text-2:    #334155;
  --dim:       #64748B;
  --muted:     #94A3B8;
  --border:    rgba(15,23,42,0.10);
  --border-2:  rgba(15,23,42,0.05);
  --shadow:    0 4px 24px rgba(15,23,42,0.06);
  --hero-grad-a: #EEF0FB;
  --hero-grad-b: #F5F7FB;
}

/* Tweakable axes — overridden by [data-vibe], [data-type], [data-shape] on <html> */
:root {
  --font-display: 'Space Grotesk', sans-serif;
  --font-body: 'DM Sans', sans-serif;
  --display-tracking: -0.02em;
  --display-transform: none;
  --display-weight: 700;
  --r-xs: 6px; --r-sm: 8px; --r-md: 10px; --r-lg: 14px; --r-xl: 18px; --r-2xl: 100px;
}
[data-type="bold"] { --font-display: 'Archivo', sans-serif; --font-body: 'Inter', sans-serif; --display-tracking: -0.03em; --display-transform: uppercase; --display-weight: 900; }
[data-type="editorial"] { --font-display: 'Fraunces', serif; --font-body: 'Inter', sans-serif; --display-tracking: -0.025em; --display-weight: 600; }
[data-shape="sharp"] { --r-xs: 0; --r-sm: 2px; --r-md: 3px; --r-lg: 4px; --r-xl: 6px; --r-2xl: 0; }
[data-shape="pillow"] { --r-xs: 12px; --r-sm: 16px; --r-md: 20px; --r-lg: 24px; --r-xl: 32px; --r-2xl: 100px; }
[data-vibe="energetic"] { --orange: #FF3B1F; --orange-h: #E62E14; }
[data-vibe="energetic"][data-theme="dark"] { --hero-grad-a: #2A1340; --hero-grad-b: #0F1428; }
[data-vibe="energetic"][data-theme="light"] { --hero-grad-a: #FFE8DF; --hero-grad-b: #F5F7FB; }
[data-vibe="editorial"] { --orange: #B8533D; --orange-h: #A44530; }
[data-vibe="editorial"][data-theme="dark"] { --indigo: #8B7FE8; --hero-grad-a: #1E2049; --hero-grad-b: #0F1428; }
[data-vibe="editorial"][data-theme="light"] { --bg: #F4EFE6; --hero-grad-a: #EDE5D6; --hero-grad-b: #F4EFE6; --indigo-bg: #ECE3D2; }

html { scroll-behavior: smooth; }
body { font-family: var(--font-body); background: var(--bg); color: var(--text); -webkit-font-smoothing: antialiased; overflow-x: hidden; line-height: 1.55; transition: background .3s, color .3s; }
h1,h2,h3,h4 { font-family: var(--font-display); letter-spacing: var(--display-tracking); }
.hero-h1, .section-title, .final-cta-title, .modal-title, .expert-name, .prog-heading { text-transform: var(--display-transform); font-weight: var(--display-weight); }
a { color: inherit; text-decoration: none; }
img { max-width: 100%; display: block; }
button { font-family: 'DM Sans', sans-serif; cursor: pointer; border: none; background: transparent; color: inherit; }

.ben-container { max-width: 1140px; margin: 0 auto; padding: 0 24px; }
.ben-section { padding: 88px 0; }
.indigo-section { background: var(--indigo-bg); padding: 88px 0; transition: background .3s; }

/* Sticky Header */
.sticky-header { position: fixed; top: 0; left: 0; right: 0; z-index: 200; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(18px); border-bottom: 1px solid var(--border); transition: transform .4s, opacity .4s, background .3s; }
.header-inner { display: flex; align-items: center; justify-content: space-between; height: 60px; gap: 14px; }
.header-logo { height: 26px; }
[data-theme="light"] .header-logo { filter: invert(1) brightness(0.4) saturate(2) hue-rotate(220deg); }
.header-center { display: flex; align-items: center; gap: 18px; }
.header-seats { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--dim); font-weight: 500; }
.header-timer-text { font-size: 13px; color: var(--orange); font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: .3px; }
.header-actions { display: flex; gap: 8px; align-items: center; }
.seats-dot, .seats-live-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); animation: pulse 2s ease infinite; display: inline-block; }
@keyframes pulse { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: .6; transform: scale(.85); } }

/* Theme Toggle */
.theme-toggle { width: 36px; height: 36px; border-radius: 50%; background: var(--bg-card); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; transition: all .25s; flex-shrink: 0; color: var(--text-2); }
.theme-toggle:hover { background: var(--indigo-bg); color: var(--indigo); transform: rotate(15deg); }
.theme-toggle-floating { position: fixed; bottom: 20px; right: 20px; z-index: 150; width: 44px; height: 44px; box-shadow: var(--shadow); }

/* Buttons */
.btn-orange { display: inline-flex; align-items: center; justify-content: center; gap: 8px; background: var(--orange); color: #fff !important; font-family: var(--font-display); font-weight: 600; border-radius: var(--r-md); transition: background .2s, transform .15s, box-shadow .2s; }
.btn-orange:hover { background: var(--orange-h); transform: translateY(-1px); box-shadow: 0 8px 24px rgba(240,90,40,.35); }
.btn-orange:active { transform: translateY(0); }
.btn-ghost { display: inline-flex; align-items: center; gap: 6px; background: transparent; color: var(--text-2); font-weight: 600; border: 1px solid var(--border); border-radius: var(--r-md); padding: 8px 16px; font-size: 13px; transition: all .2s; }
.btn-ghost:hover { border-color: var(--indigo); color: var(--indigo); }
.btn-sm { font-size: 13px; padding: 9px 18px; }
.btn-lg { font-size: 16px; padding: 15px 32px; }

/* Labels */
.section-label { display: inline-block; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .15em; color: var(--orange); margin-bottom: 12px; padding: 4px 12px; background: color-mix(in srgb, var(--orange) 12%, transparent); border-radius: var(--r-2xl); }
.section-title { font-size: clamp(24px, 3.2vw, 38px); font-weight: 700; letter-spacing: -.02em; margin-bottom: 40px; color: var(--text); text-wrap: pretty; line-height: 1.18; }

/* Hero */
.hero-section { padding: 120px 0 64px; background: linear-gradient(160deg, var(--hero-grad-a) 0%, var(--hero-grad-b) 60%); position: relative; overflow: hidden; }
.hero-section::before { content: ''; position: absolute; inset: 0; background-image: radial-gradient(circle at 20% 30%, color-mix(in srgb, var(--indigo) 15%, transparent) 0%, transparent 40%), radial-gradient(circle at 80% 70%, color-mix(in srgb, var(--orange) 8%, transparent) 0%, transparent 50%); pointer-events: none; }
.hero-grid { display: grid; grid-template-columns: 1fr .9fr; gap: 56px; align-items: center; position: relative; z-index: 1; }
.hero-badge { display: inline-block; font-size: 12px; font-weight: 600; color: var(--orange); background: color-mix(in srgb, var(--orange) 10%, transparent); border: 1px solid color-mix(in srgb, var(--orange) 25%, transparent); padding: 6px 14px; border-radius: var(--r-2xl); margin-bottom: 18px; }
.hero-h1 { font-size: clamp(28px, 3.8vw, 46px); font-weight: 700; line-height: 1.13; letter-spacing: -.025em; margin-bottom: 18px; color: var(--text); }
.hero-accent { color: var(--orange); }
.hero-sub { font-size: 17px; color: var(--text-2); line-height: 1.6; margin-bottom: 24px; max-width: 500px; }
.hero-bullets { list-style: none; display: flex; flex-direction: column; gap: 10px; margin-bottom: 26px; }
.hero-bullets li { display: flex; align-items: center; gap: 10px; font-size: 15px; color: var(--text-2); }
.hero-bullets li svg { color: var(--green); flex-shrink: 0; }
.hero-cta-block { display: flex; flex-direction: column; gap: 10px; }
.hero-price-row { display: flex; align-items: baseline; gap: 12px; }
.hero-price-old s { color: var(--red); font-size: 14px; }
.hero-price-main { font-family: 'Space Grotesk', sans-serif; font-size: 28px; font-weight: 700; color: var(--text); }
.hero-btn { align-self: flex-start; }
.hero-guarantee-note { font-size: 13px; color: var(--muted); }
.hero-desc { font-size: 15px; color: var(--text-2); line-height: 1.65; margin-bottom: 14px; max-width: 500px; }
.hero-practice-line { font-family: var(--font-display); font-size: 13px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--orange); background: color-mix(in srgb, var(--orange) 10%, transparent); border: 1px solid color-mix(in srgb, var(--orange) 25%, transparent); padding: 6px 14px; border-radius: var(--r-2xl); display: inline-block; margin-bottom: 14px; }
.hero-urgency-label { font-size: 13px; font-weight: 700; color: var(--text-2); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 6px; }
.hero-cta-sub { font-size: 13px; color: var(--text-2); margin-top: 2px; }

/* Participant offer */
.participant-offer-row { background: var(--bg2); border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); padding: 36px 0; }
.participant-offer-card { display: flex; align-items: center; gap: 24px; max-width: 680px; margin: 0 auto; background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--r-xl); padding: 28px 36px; box-shadow: var(--shadow); }
.participant-offer-icon { width: 60px; height: 60px; border-radius: var(--r-lg); background: color-mix(in srgb, var(--green) 14%, transparent); display: flex; align-items: center; justify-content: center; color: var(--green); flex-shrink: 0; font-size: 28px; }
.participant-offer-icon svg { width: 28px; height: 28px; }
.participant-offer-title { font-family: var(--font-display); font-size: 18px; font-weight: 700; color: var(--text); margin-bottom: 6px; }
.participant-offer-desc { font-size: 15px; color: var(--text-2); line-height: 1.5; }

/* Hero partner pills */
.hero-logos { margin-top: 28px; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.hero-logos-label { font-size: 11px; text-transform: uppercase; letter-spacing: .12em; color: var(--muted); font-weight: 700; }
.hero-logos-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.hero-logo-pill { font-size: 12px; color: var(--dim); font-weight: 600; opacity: .75; padding: 6px 12px; border: 1px solid var(--border); border-radius: 6px; transition: all .2s; }
.hero-logo-pill:hover { opacity: 1; border-color: var(--indigo); transform: translateY(-1px); }

/* Hero left blocks */
.hero-left { display: flex; flex-direction: column; gap: 0; }
.hero-block { }
.hero-block-hook { padding-bottom: 28px; border-bottom: 1px solid var(--border); margin-bottom: 28px; }
.hero-block-cta { }

/* Hero right — photo card */
.hero-right { position: relative; }
.hero-right-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--r-xl); overflow: hidden; box-shadow: var(--shadow); position: relative; }
.hero-photo-wrap { position: relative; }
.hero-photo { width: 100%; aspect-ratio: 4/4.4; object-fit: cover; object-position: center top; display: block; }
.hero-timer-corner { position: absolute; top: 14px; right: 14px; background: rgba(15,20,40,0.85); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.12); border-radius: 10px; padding: 8px 12px; display: flex; align-items: center; gap: 8px; }
.hero-timer-corner .timer-unit { background: transparent; padding: 0; min-width: 26px; text-align: center; }
.hero-timer-corner .timer-num { font-size: 16px; color: #fff; font-family: 'Space Grotesk', sans-serif; font-weight: 700; line-height: 1; display: block; font-variant-numeric: tabular-nums; }
.hero-timer-corner .timer-lbl { font-size: 9px; color: rgba(255,255,255,0.65); text-transform: uppercase; letter-spacing: .06em; display: block; margin-top: 2px; }
.hero-timer-corner .timer-sep { color: rgba(255,255,255,0.4); font-weight: 700; font-size: 14px; }
.hero-photo-badge { position: absolute; bottom: 0; left: 0; right: 0; background: linear-gradient(to top, rgba(15,20,40,0.95) 0%, rgba(15,20,40,0.5) 70%, transparent 100%); padding: 18px 20px 16px; }
.hero-photo-badge .photo-badge-label { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: .1em; color: rgba(255,255,255,0.7); margin-bottom: 3px; font-weight: 600; }
.hero-photo-badge strong { display: block; font-family: 'Space Grotesk', sans-serif; font-size: 18px; font-weight: 700; color: #fff; }
.hero-photo-badge span { font-size: 13px; color: rgba(255,255,255,0.75); }

/* Hero scheme card (kept for reference) */
.hero-scheme-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--r-xl); overflow: hidden; box-shadow: var(--shadow); }
.hero-scheme-header { display: flex; align-items: center; gap: 14px; padding: 20px 24px 16px; border-bottom: 1px solid var(--border); }
.hero-scheme-logo { font-family: 'Space Grotesk', sans-serif; font-size: 17px; font-weight: 800; color: var(--indigo); background: color-mix(in srgb, var(--indigo) 12%, transparent); border: 1px solid color-mix(in srgb, var(--indigo) 25%, transparent); padding: 4px 10px; border-radius: 6px; letter-spacing: .04em; flex-shrink: 0; }
.hero-scheme-header-text { display: flex; flex-direction: column; gap: 2px; }
.hero-scheme-title { font-size: 13px; font-weight: 600; color: var(--text); line-height: 1.3; }
.hero-scheme-subtitle { font-size: 12px; color: var(--text-2); line-height: 1.3; }
.hero-scheme-steps { padding: 12px 0; }
.hero-scheme-step { display: flex; align-items: center; gap: 12px; padding: 11px 24px; transition: background .15s; }
.hero-scheme-step:hover { background: color-mix(in srgb, var(--sc, var(--indigo)) 5%, transparent); }
.hero-scheme-step-icon { width: 36px; height: 36px; border-radius: 8px; background: color-mix(in srgb, var(--sc) 14%, transparent); color: var(--sc); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.hero-scheme-step-icon svg { width: 18px; height: 18px; }
.hero-scheme-step-body { flex: 1; min-width: 0; }
.hero-scheme-step-label { display: block; font-size: 13px; font-weight: 700; color: var(--text); letter-spacing: .04em; }
.hero-scheme-step-sub { display: block; font-size: 11px; color: var(--text-2); margin-top: 1px; }
.hero-scheme-step-tag { font-size: 9.5px; font-weight: 600; color: var(--sc); background: color-mix(in srgb, var(--sc) 10%, transparent); border: 1px solid color-mix(in srgb, var(--sc) 20%, transparent); padding: 3px 8px; border-radius: 20px; flex-shrink: 0; text-align: center; line-height: 1.3; word-break: keep-all; }
.hero-scheme-footer { padding: 14px 24px; border-top: 1px solid var(--border); background: color-mix(in srgb, var(--indigo) 4%, transparent); display: flex; flex-direction: column; gap: 10px; }
.hero-scheme-timer { display: flex; gap: 10px; align-items: center; justify-content: center; }
.hero-scheme-timer-unit { text-align: center; }
.hero-scheme-timer-num { display: block; font-family: 'Space Grotesk', sans-serif; font-size: 22px; font-weight: 700; color: var(--text); line-height: 1; font-variant-numeric: tabular-nums; }
.hero-scheme-timer-lbl { display: block; font-size: 9px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; margin-top: 2px; }

.hero-seats-block { padding: 0; border-top: none; }
.seats-row { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 8px; align-items: center; gap: 8px; }
.seats-taken-text { color: var(--text-2); }
.seats-left-text { color: var(--orange); font-weight: 700; }
.seats-bar { height: 5px; background: var(--border); border-radius: 3px; overflow: hidden; }
.seats-fill { height: 100%; background: linear-gradient(90deg, var(--indigo), var(--orange)); border-radius: 3px; transition: width 1s ease; }

/* BEN System Section */
.bensys-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; max-width: 900px; margin: 0 auto; }
.bensys-card { background: var(--bg-card); border: 1px solid color-mix(in srgb, var(--sc) 25%, transparent); border-radius: var(--r-xl); padding: 28px 22px; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 10px; transition: transform .2s, box-shadow .2s; }
.bensys-card:hover { transform: translateY(-3px); box-shadow: 0 12px 32px color-mix(in srgb, var(--sc) 15%, transparent); }
.bensys-icon { width: 56px; height: 56px; border-radius: 14px; background: color-mix(in srgb, var(--sc) 14%, transparent); color: var(--sc); display: flex; align-items: center; justify-content: center; }
.bensys-icon svg { width: 24px; height: 24px; }
.bensys-label { font-family: var(--font-display); font-size: 15px; font-weight: 800; color: var(--text); letter-spacing: .05em; }
.bensys-sub { font-size: 12px; color: var(--dim); letter-spacing: .06em; text-transform: uppercase; }
.bensys-result { font-size: 12px; font-weight: 600; color: var(--sc); background: color-mix(in srgb, var(--sc) 10%, transparent); border: 1px solid color-mix(in srgb, var(--sc) 20%, transparent); padding: 4px 10px; border-radius: 20px; margin-top: 4px; line-height: 1.4; }

/* Quote divider */
.quote-divider { background: var(--indigo-bg); padding: 56px 24px; border-top: 1px solid var(--border-2); border-bottom: 1px solid var(--border-2); transition: background .3s; }
.quote-text { font-family: 'Space Grotesk', sans-serif; font-size: clamp(18px, 2.6vw, 26px); font-weight: 500; font-style: italic; color: var(--text-2); max-width: 820px; margin: 0 auto; text-align: center; line-height: 1.5; text-wrap: pretty; }

/* Checklist */
.checklist-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; max-width: 720px; margin: 0 auto 24px; }
.check-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--r-lg); padding: 18px 20px; display: flex; align-items: flex-start; gap: 14px; text-align: left; transition: all .2s; cursor: pointer; box-shadow: var(--shadow); }
.check-card:hover { border-color: var(--orange); transform: translateY(-2px); }
.check-card.checked { border-color: var(--orange); background: color-mix(in srgb, var(--orange) 7%, var(--bg-card)); }
.check-num { width: 30px; height: 30px; border-radius: 8px; border: 1.5px solid var(--border); display: flex; align-items: center; justify-content: center; font-family: 'Space Grotesk', sans-serif; font-size: 12px; font-weight: 700; color: var(--muted); flex-shrink: 0; transition: all .2s; }
.check-card.checked .check-num { background: var(--orange); border-color: var(--orange); color: #fff; }
.check-text { font-size: 15px; color: var(--text-2); padding-top: 5px; }
.check-card.checked .check-text { color: var(--text); }
.diagnosis-block { max-height: 0; overflow: hidden; opacity: 0; transition: all .5s cubic-bezier(.22,1,.36,1); }
.diagnosis-block.visible { max-height: 100px; opacity: 1; }
.diagnosis-inner { display: flex; align-items: center; justify-content: space-between; gap: 16px; background: color-mix(in srgb, var(--orange) 10%, var(--bg-card)); border: 1px solid color-mix(in srgb, var(--orange) 30%, transparent); border-radius: 10px; padding: 14px 20px; margin-top: 16px; }
.diagnosis-inner strong { color: var(--text); }
.diagnosis-inner span { color: var(--text-2); }

/* Stats */
.stats-row { background: var(--bg2); border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); }
.stats-inner { display: flex; justify-content: center; gap: 0; }
.stat-item { flex: 1; max-width: 280px; text-align: center; padding: 36px 20px; border-right: 1px solid var(--border); }
.stat-item:last-child { border-right: none; }
.stat-val { display: block; font-family: 'Space Grotesk', sans-serif; font-size: 44px; font-weight: 700; color: var(--text); letter-spacing: -.03em; line-height: 1; }
.stat-lbl { display: block; font-size: 14px; color: var(--muted); margin-top: 6px; }

/* Program */
.prog-tabs { display: flex; gap: 8px; margin-bottom: 20px; overflow-x: auto; padding-bottom: 4px; }
.prog-tab { padding: 11px 20px; border-radius: 10px; border: 1.5px solid var(--border); background: var(--bg-card); color: var(--text-2); font-family: 'Space Grotesk', sans-serif; transition: all .2s; white-space: nowrap; cursor: pointer; }
.prog-tab:hover { border-color: var(--indigo); transform: translateY(-1px); }
.prog-tab-label { display: block; font-size: 13px; font-weight: 700; letter-spacing: .04em; }
.prog-tab-sub { display: block; font-size: 11px; font-weight: 400; margin-top: 1px; opacity: .7; }
.prog-card { border: 1px solid var(--border); border-radius: var(--r-lg); overflow: hidden; margin-bottom: 16px; background: var(--bg-card); box-shadow: var(--shadow); }
.prog-card-inner { display: grid; grid-template-columns: 1fr .55fr; gap: 0; }
.prog-card-left { padding: 32px; border-right: 1px solid var(--border); }
.prog-card-right { padding: 32px; display: flex; flex-direction: column; gap: 14px; justify-content: center; background: var(--indigo-bg); }
.prog-icon { width: 46px; height: 46px; border-radius: 12px; display: flex; align-items: center; justify-content: center; margin-bottom: 14px; }
.prog-heading { font-size: 22px; font-weight: 700; color: var(--text); margin-bottom: 14px; }
.prog-items { list-style: none; display: flex; flex-direction: column; gap: 10px; }
.prog-items li { display: flex; align-items: flex-start; gap: 10px; font-size: 15px; color: var(--text-2); }
.prog-arrow { font-size: 14px; font-weight: 700; flex-shrink: 0; margin-top: 1px; }
.prog-gift { border: 1px solid; border-radius: 10px; padding: 14px 16px; display: flex; align-items: center; gap: 10px; font-size: 14px; color: var(--text-2); background: var(--bg-card); }
.prog-gift svg { flex-shrink: 0; color: var(--green); }
.prog-result-tag { border: 1px solid; border-radius: 10px; padding: 12px 16px; font-size: 14px; font-weight: 600; text-align: center; }
.prog-outcomes { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.prog-outcome { border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; font-size: 13px; color: var(--text-2); cursor: pointer; transition: all .2s; display: flex; align-items: flex-start; gap: 8px; background: var(--bg-card); }
.prog-outcome:hover { border-color: var(--indigo); transform: translateY(-1px); }
.prog-outcome-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; margin-top: 5px; }

/* Four Days */
.four-days-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; max-width: 760px; margin: 0 auto 32px; }
.four-days-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--r-lg); padding: 22px 24px; display: flex; align-items: flex-start; gap: 16px; box-shadow: var(--shadow); transition: transform .2s, border-color .2s; }
.four-days-card:hover { transform: translateY(-2px); border-color: var(--accent, var(--indigo)); }
.four-days-card-icon { width: 44px; height: 44px; border-radius: 10px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.four-days-card-icon svg { width: 20px; height: 20px; }
.four-days-card-text { font-size: 15px; color: var(--text); font-weight: 500; padding-top: 10px; line-height: 1.4; }
.four-days-conclusion { text-align: center; max-width: 560px; margin: 0 auto 32px; }
.four-days-conclusion-main { font-size: 16px; font-weight: 600; color: var(--text); margin-bottom: 8px; }
.four-days-conclusion-result { font-size: 15px; color: var(--text-2); line-height: 1.6; }
.four-days-cta { text-align: center; }

/* Comparison */
.comp-table { border-radius: var(--r-lg); overflow: hidden; border: 1px solid var(--border); box-shadow: var(--shadow); }
.comp-head, .comp-row { display: grid; grid-template-columns: 1.4fr 1fr 1fr; }
.comp-head { background: var(--bg2); }
.comp-cell-label { padding: 14px 20px; font-size: 13px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; display: flex; align-items: center; background: var(--bg-card); }
.comp-cell { padding: 14px 20px; font-size: 14px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 8px; }
.comp-row:last-child .comp-cell, .comp-row:last-child .comp-cell-label { border-bottom: none; }
.comp-col-other { color: var(--muted); background: color-mix(in srgb, var(--red) 4%, var(--bg-card)); }
.comp-col-ben { color: var(--text); background: color-mix(in srgb, var(--green) 8%, var(--bg-card)); font-weight: 500; border-left: 2px solid color-mix(in srgb, var(--green) 30%, transparent); }
.comp-head .comp-col-other, .comp-head .comp-col-ben { font-family: 'Space Grotesk', sans-serif; font-size: 15px; font-weight: 700; }
.comp-head .comp-col-other { color: var(--muted); }
.comp-head .comp-col-ben { color: var(--green); }
.comp-x { color: var(--red); font-weight: 700; flex-shrink: 0; }
.comp-ok { color: var(--green); font-weight: 700; flex-shrink: 0; }

/* Expert */
.expert-grid { display: grid; grid-template-columns: .65fr 1fr; gap: 56px; align-items: center; }
.expert-img-wrap { border-radius: var(--r-lg); overflow: hidden; border: 1px solid var(--border); box-shadow: var(--shadow); }
.expert-img { width: 100%; aspect-ratio: 4/5; object-fit: cover; object-position: center top; }
.expert-name { font-size: 36px; font-weight: 700; color: var(--text); margin: 8px 0 4px; }
.expert-role { font-size: 16px; color: var(--text-2); margin-bottom: 28px; }
.expert-stats-row { display: flex; gap: 14px; margin-bottom: 24px; flex-wrap: wrap; }
.expert-stat { flex: 1; min-width: 110px; background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; }
.expert-stat-val { display: block; font-family: 'Space Grotesk', sans-serif; font-size: 28px; font-weight: 700; color: var(--orange); line-height: 1; }
.expert-stat-lbl { display: block; font-size: 12px; color: var(--muted); margin-top: 5px; }
.expert-quote { font-size: 16px; font-style: italic; color: var(--text-2); line-height: 1.7; border-left: 3px solid var(--orange); padding-left: 18px; }
.expert-bio { font-size: 14px; color: var(--dim); line-height: 1.6; margin-top: 14px; padding-left: 21px; }

/* Testimonials */
.testimonials-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 36px; }
.testi-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--r-lg); overflow: hidden; transition: transform .2s, border-color .2s; box-shadow: var(--shadow); }
.testi-card:hover { transform: translateY(-3px); border-color: var(--orange); }
.testi-video { aspect-ratio: 16/10; background: linear-gradient(135deg, var(--indigo-bg), var(--bg2)); display: flex; align-items: center; justify-content: center; cursor: pointer; }
.testi-card:hover .testi-play { transform: scale(1.1); background: var(--orange); color: #fff; }
.testi-play { width: 56px; height: 56px; border-radius: 50%; background: color-mix(in srgb, var(--orange) 18%, transparent); display: flex; align-items: center; justify-content: center; color: var(--orange); transition: all .25s; }
.testi-info { padding: 16px 18px; }
.testi-stars { display: flex; gap: 2px; color: #F59E0B; margin-bottom: 8px; }
.testi-result { font-size: 15px; font-weight: 600; color: var(--text); margin-bottom: 4px; }
.testi-company { font-size: 13px; color: var(--muted); }

/* Marquee */
.marquee-wrap { overflow: hidden; mask-image: linear-gradient(90deg, transparent, black 12%, black 88%, transparent); }
.marquee-track { display: flex; gap: 12px; animation: marquee 22s linear infinite; width: max-content; }
@keyframes marquee { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }
.marquee-item { background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px; padding: 10px 28px; font-size: 13px; color: var(--muted); font-weight: 600; white-space: nowrap; }

/* Offer */
.offer-card { max-width: 540px; margin: 0 auto; background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--r-xl); padding: 36px; box-shadow: var(--shadow); }
.offer-items { display: flex; flex-direction: column; gap: 14px; margin-bottom: 20px; }
.offer-item { display: flex; align-items: center; gap: 12px; }
.offer-item-check { width: 24px; height: 24px; border-radius: 50%; background: color-mix(in srgb, var(--green) 16%, transparent); display: flex; align-items: center; justify-content: center; color: var(--green); flex-shrink: 0; }
.offer-item-name { flex: 1; font-size: 15px; color: var(--text); }
.offer-item-price { font-size: 14px; color: var(--muted); font-weight: 600; }
.offer-sep { height: 1px; background: var(--border); margin: 4px 0 16px; }
.offer-total-row { display: flex; justify-content: space-between; margin-bottom: 8px; }
.offer-total-label { font-size: 14px; color: var(--muted); }
.offer-total-old { font-size: 15px; color: var(--muted); }
.offer-price-row { display: flex; align-items: baseline; gap: 12px; margin-bottom: 24px; }
.offer-price-big { font-family: 'Space Grotesk', sans-serif; font-size: 56px; font-weight: 700; color: var(--text); letter-spacing: -.03em; line-height: 1; }
.offer-price-note { font-size: 13px; color: var(--muted); }
.offer-btn { width: 100%; font-size: 18px; padding: 20px 32px; }

/* Sealed guarantee */
.offer-guarantee { display: flex; align-items: center; gap: 14px; margin-top: 18px; padding: 14px 16px; background: color-mix(in srgb, var(--green) 8%, var(--bg-card)); border: 1px solid color-mix(in srgb, var(--green) 22%, transparent); border-radius: 10px; }
.offer-guarantee-seal { width: 52px; height: 52px; border-radius: 50%; background: var(--green); color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; flex-shrink: 0; box-shadow: 0 4px 12px rgba(16,185,129,.3); position: relative; }
.offer-guarantee-seal::before { content: ''; position: absolute; inset: -4px; border: 2px dashed var(--green); border-radius: 50%; opacity: .35; animation: spin 12s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.offer-guarantee-seal strong { font-family: 'Space Grotesk', sans-serif; font-size: 15px; font-weight: 700; line-height: 1; }
.offer-guarantee-seal span { font-size: 8px; text-transform: uppercase; letter-spacing: .05em; line-height: 1; margin-top: 2px; }
.offer-guarantee-text { font-size: 14px; color: var(--text-2); line-height: 1.5; }
.offer-guarantee-text strong { color: var(--text); display: block; margin-bottom: 2px; font-family: 'Space Grotesk', sans-serif; font-size: 15px; }

.offer-payment { display: flex; justify-content: center; gap: 8px; margin-top: 16px; flex-wrap: wrap; }

/* FAQ — compact */
.faq-list { max-width: 720px; margin: 0 auto; display: flex; flex-direction: column; gap: 4px; }
.faq-item { background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; transition: border-color .2s; }
.faq-item.open { border-color: var(--indigo); }
.faq-q { width: 100%; display: flex; justify-content: space-between; align-items: center; padding: 14px 18px; color: var(--text); font-family: 'Space Grotesk', sans-serif; font-size: 15px; font-weight: 600; text-align: left; gap: 12px; }
.faq-icon { color: var(--muted); flex-shrink: 0; transition: transform .3s; }
.faq-a { overflow: hidden; transition: max-height .35s cubic-bezier(.22,1,.36,1), opacity .35s, padding .35s; padding: 0 18px; }
.faq-a p { font-size: 14px; color: var(--text-2); line-height: 1.6; }

/* Final CTA */
.final-cta-section { background: var(--indigo-bg); padding: 96px 0; border-top: 1px solid var(--border); }
.final-cta-inner { text-align: center; max-width: 600px; margin: 0 auto; }
.final-cta-title { font-size: clamp(24px, 3.5vw, 40px); font-weight: 700; color: var(--text); margin-bottom: 32px; line-height: 1.18; }
.final-timer-row { display: flex; justify-content: center; gap: 10px; margin-bottom: 20px; }
.final-timer-block { background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px; padding: 14px 18px; min-width: 72px; text-align: center; box-shadow: var(--shadow); }
.final-timer-num { display: block; font-family: 'Space Grotesk', sans-serif; font-size: 32px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; line-height: 1; }
.final-timer-lbl { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .07em; margin-top: 4px; display: block; }
.final-seats-row { display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 15px; color: var(--text-2); margin-bottom: 24px; }
.final-payment-row { display: flex; justify-content: center; gap: 8px; margin-top: 20px; flex-wrap: wrap; }
.pay-badge { font-size: 12px; font-weight: 700; color: var(--text-2); background: var(--bg-card); border: 1px solid var(--border); border-radius: 6px; padding: 6px 14px; }

/* Footer */
.ben-footer { border-top: 1px solid var(--border); padding: 28px 0; background: var(--bg2); }
.footer-inner { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; }
.footer-logo { height: 22px; opacity: 0.7; }
[data-theme="light"] .footer-logo { filter: invert(1) brightness(0.3) saturate(2) hue-rotate(220deg); }
.footer-copy { font-size: 13px; color: var(--muted); }
.footer-links { display: flex; gap: 20px; }
.footer-links a { font-size: 13px; color: var(--muted); transition: color .2s; }
.footer-links a:hover { color: var(--indigo); }

/* Modal */
.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.7); backdrop-filter: blur(8px); z-index: 500; display: flex; align-items: center; justify-content: center; padding: 20px; animation: fadeOverlay .2s; }
@keyframes fadeOverlay { from { opacity: 0; } to { opacity: 1; } }
.modal-box { background: var(--bg-card); border: 1px solid var(--border); border-radius: 18px; width: 100%; max-width: 500px; overflow: hidden; box-shadow: 0 20px 60px rgba(0,0,0,0.4); animation: slideUp .3s cubic-bezier(.22,1,.36,1); }
@keyframes slideUp { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: translateY(0); } }
.modal-header { padding: 16px 20px 0; display: flex; align-items: center; gap: 12px; }
.modal-progress-bar { flex: 1; height: 4px; background: var(--border); border-radius: 2px; overflow: hidden; }
.modal-progress-fill { height: 100%; background: linear-gradient(90deg, var(--indigo), var(--orange)); border-radius: 2px; transition: width .4s; }
.modal-close { width: 30px; height: 30px; border-radius: 50%; background: var(--bg2); display: flex; align-items: center; justify-content: center; color: var(--muted); transition: all .2s; flex-shrink: 0; }
.modal-close:hover { background: var(--border); color: var(--text); }
.modal-step { padding: 28px 28px 32px; animation: stepIn .3s; }
@keyframes stepIn { from { opacity: 0; transform: translateX(16px); } to { opacity: 1; transform: translateX(0); } }
.modal-step-counter { font-size: 12px; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); font-weight: 700; margin-bottom: 8px; }
.modal-title { font-family: 'Space Grotesk', sans-serif; font-size: 22px; font-weight: 700; color: var(--text); margin-bottom: 4px; }
.modal-subtitle { font-size: 14px; color: var(--text-2); margin-bottom: 20px; }
.modal-options { display: flex; flex-direction: column; gap: 8px; margin-top: 18px; }
.modal-option { display: flex; align-items: center; gap: 14px; background: var(--bg2); border: 1.5px solid var(--border); border-radius: 10px; padding: 14px 16px; text-align: left; transition: all .2s; cursor: pointer; }
.modal-option:hover { border-color: var(--indigo); }
.modal-option.selected { border-color: var(--orange); background: color-mix(in srgb, var(--orange) 6%, var(--bg2)); }
.modal-option-check { width: 24px; height: 24px; border-radius: 6px; border: 1.5px solid var(--border); display: flex; align-items: center; justify-content: center; flex-shrink: 0; color: var(--orange); transition: all .2s; }
.modal-option.selected .modal-option-check { background: var(--orange); border-color: var(--orange); color: #fff; }
.modal-option-label { font-size: 15px; font-weight: 600; color: var(--text); display: block; }
.modal-option-desc { font-size: 13px; color: var(--muted); display: block; margin-top: 2px; }
.modal-form-fields { display: flex; flex-direction: column; gap: 12px; margin-top: 18px; }
.form-group { display: flex; flex-direction: column; gap: 6px; }
.form-group label { font-size: 13px; font-weight: 600; color: var(--text-2); }
.form-group input { background: var(--bg2); border: 1.5px solid var(--border); border-radius: 10px; padding: 12px 16px; color: var(--text); font-family: inherit; font-size: 15px; outline: none; transition: border-color .2s; }
.form-group input:focus { border-color: var(--indigo); }
.form-group input.error { border-color: var(--red); }
.form-group input::placeholder { color: var(--muted); }
.form-err { font-size: 12px; color: var(--red); }
.modal-success { padding: 40px 28px; text-align: center; }
.modal-success svg { color: var(--green); margin: 0 auto 16px; }
.modal-success h3 { font-family: 'Space Grotesk', sans-serif; font-size: 22px; font-weight: 700; color: var(--text); margin-bottom: 10px; }
.modal-success p { font-size: 15px; color: var(--text-2); line-height: 1.6; margin-bottom: 20px; }
.modal-success-details { display: flex; justify-content: space-between; align-items: center; background: var(--indigo-bg); border: 1px solid var(--border); border-radius: 10px; padding: 12px 18px; margin-bottom: 24px; font-size: 14px; }
.modal-success-details span { color: var(--text-2); }
.modal-success-details strong { color: var(--orange); font-size: 18px; font-family: 'Space Grotesk', sans-serif; }

/* ── PERFORMANCE & ACCESSIBILITY ── */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
}
:focus-visible { outline: 2px solid var(--indigo); outline-offset: 3px; border-radius: var(--r-xs); }

/* ── TABLET  769–1024px ── */
@media (min-width: 769px) and (max-width: 1024px) {
  .ben-container { padding: 0 32px; }
  .ben-section, .indigo-section { padding: 72px 0; }
  .hero-section { padding: 110px 0 56px; }
  .hero-grid { grid-template-columns: 1fr .85fr; gap: 36px; }
  .hero-h1 { font-size: clamp(26px, 3.5vw, 38px); }
  .hero-sub { font-size: 16px; }
  .expert-grid { grid-template-columns: .55fr 1fr; gap: 36px; }
  .testimonials-grid { grid-template-columns: repeat(3,1fr); gap: 12px; }
  .prog-card-inner { grid-template-columns: 1fr .45fr; }
  .prog-outcomes { grid-template-columns: repeat(2,1fr); }
  .comp-head, .comp-row { grid-template-columns: 1.2fr 1fr 1fr; }
  .comp-cell, .comp-cell-label { padding: 12px 14px; }
  .stats-inner { gap: 0; }
  .stat-val { font-size: 38px; }
  .header-center { display: none; }
  .header-actions .btn-ghost { display: none; }
}

/* ── MOBILE  ≤768px ── */
@media (max-width: 768px) {
  /* Layout rhythm */
  .ben-container { padding: 0 16px; }
  .ben-section, .indigo-section { padding: 56px 0; }
  .quote-divider { padding: 40px 16px; }

  /* Sticky header — logo + pay only */
  .header-inner { height: 52px; gap: 8px; }
  .header-logo { height: 22px; }
  .header-center { display: none; }
  .header-actions .btn-ghost { display: none; }
  .header-actions { gap: 6px; }

  /* Hero */
  .hero-section { padding: 88px 0 48px; }
  .hero-grid { grid-template-columns: 1fr; gap: 24px; }
  .hero-right { order: -1; }
  .hero-h1 { font-size: clamp(26px, 7.5vw, 36px); margin-bottom: 14px; }
  .hero-sub { font-size: 15px; margin-bottom: 18px; }
  .hero-bullets { gap: 8px; margin-bottom: 20px; }
  .hero-bullets li { font-size: 14px; }
  .hero-btn { width: 100%; justify-content: center; }
  .hero-price-main { font-size: 24px; }
  .hero-logos { margin-top: 20px; gap: 8px; }
  /* Scheme card mobile */
  .hero-block-hook { padding-bottom: 20px; margin-bottom: 20px; }
  .hero-scheme-step-tag { display: none; }
  .hero-scheme-step { padding: 9px 16px; }
  .hero-scheme-footer { padding: 12px 16px; }
  .hero-scheme-header { padding: 14px 16px 12px; }

  /* Quote divider */
  .quote-text { font-size: clamp(16px, 4.5vw, 20px); }

  /* Checklist */
  .checklist-grid { grid-template-columns: 1fr; gap: 8px; }
  .check-card { padding: 14px 16px; min-height: 56px; }
  .diagnosis-inner { flex-direction: column; text-align: center; gap: 12px; }
  .diagnosis-block.visible { max-height: 140px; }

  /* Stats — horizontal scroll snapping */
  .stats-row { overflow-x: auto; -webkit-overflow-scrolling: touch; scroll-snap-type: x mandatory; }
  .stats-inner { flex-direction: row; min-width: max-content; justify-content: flex-start; gap: 0; }
  .stat-item { border-right: 1px solid var(--border); border-bottom: none; flex-shrink: 0; scroll-snap-align: start; min-width: 160px; padding: 28px 20px; }
  .stat-val { font-size: 36px; }

  /* Program */
  .prog-tabs { gap: 6px; scroll-snap-type: x mandatory; -webkit-overflow-scrolling: touch; }
  .prog-tab { scroll-snap-align: start; flex-shrink: 0; min-height: 48px; padding: 10px 14px; }
  .prog-card-inner { grid-template-columns: 1fr; }
  .prog-card-left { padding: 20px; }
  .prog-card-right { padding: 20px; border-top: 1px solid var(--border); background: var(--indigo-bg); }
  .prog-heading { font-size: 19px; }
  .prog-outcomes { grid-template-columns: repeat(2, 1fr); gap: 6px; }
  .prog-outcome { padding: 10px 10px; font-size: 12px; }

  /* New hero elements */
  .hero-desc { font-size: 14px; margin-bottom: 10px; }
  .hero-practice-line { font-size: 11px; }

  /* Participant offer */
  .participant-offer-card { flex-direction: column; padding: 20px; gap: 14px; }

  /* Four days */
  .four-days-grid { grid-template-columns: 1fr; gap: 10px; }
  .bensys-grid { grid-template-columns: repeat(2, 1fr); gap: 12px; }
  .four-days-card { padding: 16px 18px; }

  /* Comparison — stacked mobile layout */
  .comp-table { overflow: hidden; }
  .comp-head { display: none; }
  .comp-row { display: flex; flex-direction: column; border-bottom: 1px solid var(--border); padding: 14px 16px; gap: 6px; }
  .comp-row:last-child { border-bottom: none; }
  .comp-cell-label { padding: 0; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); background: transparent; font-weight: 700; border-bottom: none; }
  .comp-cell { padding: 0; border-bottom: none; font-size: 13px; line-height: 1.4; }
  .comp-col-other { background: transparent; }
  .comp-col-ben { background: transparent; border-left: none; border-top: 1px solid color-mix(in srgb, var(--green) 25%, transparent); padding-top: 6px !important; }

  /* Expert */
  .expert-grid { grid-template-columns: 1fr; gap: 24px; }

// Theme management — auto-detect + persist
function useTheme() {
  const [theme, setTheme] = React.useState(() => {
    try {
      const saved = localStorage.getItem('ben_theme');
      if (saved === 'light' || saved === 'dark') return saved;
    } catch(e) {}
    return window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
  });
  const [userSet, setUserSet] = React.useState(() => {
    try { return !!localStorage.getItem('ben_theme'); } catch(e) { return false; }
  });
  React.useEffect(() => {
    document.documentElement.setAttribute('data-theme', theme);
  }, [theme]);
  React.useEffect(() => {
    const mq = window.matchMedia('(prefers-color-scheme: light)');
    const onChange = (e) => { if (!userSet) setTheme(e.matches ? 'light' : 'dark'); };
    if (mq.addEventListener) { mq.addEventListener('change', onChange); return () => mq.removeEventListener('change', onChange); }
  }, [userSet]);
  const toggle = () => {
    setTheme(t => {
      const nt = t === 'dark' ? 'light' : 'dark';
      try { localStorage.setItem('ben_theme', nt); } catch(e) {}
      return nt;
    });
    setUserSet(true);
  };
  return [theme, toggle];
}

function ThemeToggleBtn({ theme, onToggle, floating }) {
  const isDark = theme === 'dark';
  return (
    <button
      onClick={onToggle}
      className={`theme-toggle ${floating ? 'theme-toggle-floating' : ''}`}
      aria-label="Сменить тему"
      title={isDark ? 'Включить светлую тему' : 'Включить тёмную тему'}
    >
      {isDark ? (
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">

          <line x1="21" y1="12" x2="23" y2="12"/>

          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
        </svg>
      ) : (
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
      )}
    </button>
  );
}
